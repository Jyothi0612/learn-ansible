- name: print multiplication table
  hosts: local
  connection: local
  vars_prompt:
    - name: number
      prompt: "Eneter a number"
      private: no
  tasks:
    - name: print multiplication table
      debug:
        msg: "{{ number }} * {{ item }} = {{ number | int * item | int }}"
      loop: "{{ range(1, number | int + 1) }}"