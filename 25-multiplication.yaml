- name: print multiplication table
  hosts: local
  connection: local
  vars_prompt:
    - name: number
      prompt: "Enter a number"
      private: no
  tasks:
    # - name: print multiplication table
    #   debug:
    #     msg: "{{ number }} * {{ item }} = {{ number | int * item}}"
    #   loop: "{{ range(1, 11) }}"
    - name: print multiplication table
      debug:
        msg: >-
          {% set rows = [] %}
          {% for i in range(1,11) %}
          {% set _ = rows.append(number ~ "*" ~ i ~ "=" ~ (number | int * i)) %}
          {% endfor %}
          {{ rows }}