- name: demo on filters
  hosts: local
  connection: local
  vars:
    topics: Linux, Shell, Ansible, Terraform, Docker
    names:
    - siva
    - jyothi
  tasks:
    - name: print the name
      debug:
        msg: "Hi, {{ person_name | default('Jyothi') }}"

    - name: convert string to list
      debug:
        msg: "Topics are: {{ topics | split(',') | map('trim') }}"
    
    - name: convert list to string
      debug:
        msg: "Full name: {{ names | join(' ') }}"