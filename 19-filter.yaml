- name: demo on filters
  hosts: local
  connection: local
  vars:
    topics: Linux, Shell, Ansible, Terraform, Docker
  tasks:
    - name: print the name
      debug:
        msg: "Hi, {{ person_name | default('Jyothi') }}"

    - name: covert string to list
      debug:
        msg: "Topics are: {{ topics | split(',') | map(trim) | list }}"